name: 💡 Feature Request
description: Suggest a new developer cache, toolchain, or offload target
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a developer cache, build artifact, or workflow to offload to satellite storage? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: What dev tool or cache would you like to offload?
      description: e.g. Unity build cache, PyTorch checkpoints, CocoaPods cache, etc.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or Path
      description: Where does this tool store its files by default, and how can it be safely redirected?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other information or references.
